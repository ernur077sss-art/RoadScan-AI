name: RoadScan verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: roadscan_test
          POSTGRES_USER: roadscan
          POSTGRES_PASSWORD: local-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U roadscan"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.lock
      - name: Migrate real PostgreSQL and PostGIS
        env:
          ROADSCAN_DATABASE_URL: postgresql+psycopg://roadscan:local-ci-only@localhost:5432/roadscan_test
        run: alembic upgrade head
      - run: python -m scripts.check_brand
      - name: API tests on PostgreSQL
        env:
          ROADSCAN_TEST_DATABASE_URL: postgresql+psycopg://roadscan:local-ci-only@localhost:5432/roadscan_test
        run: python -m pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.lock
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm test:config && pnpm typecheck && pnpm build
        working-directory: web
        env: {NEXT_TELEMETRY_DISABLED: '1'}
      - name: Build with Vercel configuration (no deployment)
        run: pnpm build
        working-directory: web
        env:
          VERCEL: '1'
          # Build-only fixture; this job never connects to or deploys an API.
          API_INTERNAL_URL: https://api.roadscan-ci.vercel.app
          NEXT_TELEMETRY_DISABLED: '1'
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm test:e2e
        working-directory: web
        env: {ROADSCAN_PYTHON: python, CI: 'true'}
